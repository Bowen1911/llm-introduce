<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">KV 缓存  历史键值复用  新位置继续追加</title>
<desc id="desc">prefill计算前缀的每层K和V。decode计算新位置的Q、K、V，新Q读取历史及当前K、V，再把当前K、V追加到缓存。图中的缓存索引对应已经处理的输入位置。</desc>
<rect width="1000" height="440" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536978"/></marker></defs>
<style>text{font-family:"Noto Serif CJK SC",serif;fill:#18232C;font-size:22px} .title{font-size:29px;font-weight:700} .small{font-size:20px} .bold{font-weight:700}</style>
<text x="20" y="42" class="title" text-anchor="start">KV 缓存  历史键值复用  新位置继续追加</text>
<rect x="20" y="105" width="280" height="95" rx="5" fill="#DDEAF2" stroke="#536978" stroke-width="1.5"/>
<text x="160.0" y="145.5" class="" text-anchor="middle">prefill</text>
<text x="160.0" y="176.5" class="" text-anchor="middle">一次处理输入前缀</text>
<rect x="390" y="105" width="580" height="95" rx="5" fill="#F1F3F5" stroke="#536978" stroke-width="1.5"/>
<text x="680.0" y="145.5" class="" text-anchor="middle">每层缓存</text>
<text x="680.0" y="176.5" class="" text-anchor="middle">K₁…Kₛ   V₁…Vₛ</text>
<polyline points="300,152 383,152" fill="none" stroke="#536978" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="20" y="275" width="280" height="105" rx="5" fill="#DDEAF2" stroke="#536978" stroke-width="1.5"/>
<text x="160.0" y="320.5" class="" text-anchor="middle">decode  新输入位置</text>
<text x="160.0" y="351.5" class="" text-anchor="middle">计算新 Q K V</text>
<rect x="390" y="275" width="275" height="105" rx="5" fill="#F6E4BC" stroke="#536978" stroke-width="1.5"/>
<text x="527.5" y="320.5" class="" text-anchor="middle">新 query 读取</text>
<text x="527.5" y="351.5" class="" text-anchor="middle">历史与当前 K V</text>
<rect x="735" y="275" width="235" height="105" rx="5" fill="#F1F3F5" stroke="#536978" stroke-width="1.5"/>
<text x="852.5" y="320.5" class="" text-anchor="middle">当前 K V 入缓存</text>
<text x="852.5" y="351.5" class="" text-anchor="middle">长度从 S 到 S+1</text>
<polyline points="300,327 383,327" fill="none" stroke="#536978" stroke-width="2"  marker-end="url(#arrow)"/>
<polyline points="665,327 728,327" fill="none" stroke="#536978" stroke-width="2"  marker-end="url(#arrow)"/>
<polyline points="680,200 680,240 525,240 525,268" fill="none" stroke="#536978" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="20" y="423" class="small" text-anchor="start">每层分别缓存；省去了历史投影重算，历史读取与注意力计算仍有成本。</text>
</svg>