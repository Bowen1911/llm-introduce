<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">RAG  回答之前先建立可核查的证据链</title>
<desc id="desc">离线文档经过切分和编码构建索引。在线问题召回候选、重排筛选、交给生成器并核查答案与证据。每段失败需要不同的诊断。</desc>
<rect width="1000" height="500" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536978"/></marker></defs>
<style>text{font-family:"Noto Serif CJK SC",serif;fill:#18232C;font-size:22px} .title{font-size:29px;font-weight:700} .small{font-size:20px} .bold{font-weight:700}</style>
<text x="20" y="42" class="title" text-anchor="start">RAG  回答之前先建立可核查的证据链</text>
<text x="20" y="92" class="bold" text-anchor="start">离线准备</text>
<rect x="20" y="115" width="240" height="78" rx="5" fill="#DDEAF2" stroke="#536978" stroke-width="1.5"/>
<text x="140.0" y="147.0" class="" text-anchor="middle">原始资料</text>
<text x="140.0" y="178.0" class="" text-anchor="middle">版本与访问权限</text>
<rect x="380" y="115" width="240" height="78" rx="5" fill="#F1F3F5" stroke="#536978" stroke-width="1.5"/>
<text x="500.0" y="147.0" class="" text-anchor="middle">切分与文档编码</text>
<text x="500.0" y="178.0" class="" text-anchor="middle">保留完整条件</text>
<rect x="740" y="115" width="240" height="78" rx="5" fill="#DDEAF2" stroke="#536978" stroke-width="1.5"/>
<text x="860.0" y="147.0" class="" text-anchor="middle">可检索索引</text>
<text x="860.0" y="178.0" class="" text-anchor="middle">保留来源定位</text>
<polyline points="260,154 373,154" fill="none" stroke="#536978" stroke-width="2"  marker-end="url(#arrow)"/>
<polyline points="620,154 733,154" fill="none" stroke="#536978" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="20" y="252" class="bold" text-anchor="start">在线回答</text>
<rect x="20" y="285" width="195" height="100" rx="5" fill="#DDEAF2" stroke="#536978" stroke-width="1.5"/>
<text x="117.5" y="328.0" class="" text-anchor="middle">问题</text>
<text x="117.5" y="359.0" class="" text-anchor="middle">与查询编码</text>
<rect x="275" y="285" width="195" height="100" rx="5" fill="#DDEAF2" stroke="#536978" stroke-width="1.5"/>
<text x="372.5" y="328.0" class="" text-anchor="middle">召回与重排</text>
<text x="372.5" y="359.0" class="" text-anchor="middle">选出证据</text>
<rect x="530" y="285" width="195" height="100" rx="5" fill="#DDEAF2" stroke="#536978" stroke-width="1.5"/>
<text x="627.5" y="328.0" class="" text-anchor="middle">问题与证据</text>
<text x="627.5" y="359.0" class="" text-anchor="middle">交给生成器</text>
<rect x="785" y="285" width="195" height="100" rx="5" fill="#F6E4BC" stroke="#536978" stroke-width="1.5"/>
<text x="882.5" y="328.0" class="" text-anchor="middle">答案核查</text>
<text x="882.5" y="359.0" class="" text-anchor="middle">引用支持结论</text>
<polyline points="215,335 268,335" fill="none" stroke="#536978" stroke-width="2"  marker-end="url(#arrow)"/>
<polyline points="470,335 523,335" fill="none" stroke="#536978" stroke-width="2"  marker-end="url(#arrow)"/>
<polyline points="725,335 778,335" fill="none" stroke="#536978" stroke-width="2"  marker-end="url(#arrow)"/>
<polyline points="860,193 860,225 372,225 372,278" fill="none" stroke="#536978" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="20" y="442" class="small" text-anchor="start">找不到：查资料、切分和召回。找到了还答错：直接喂正确证据检验生成。</text>
<text x="20" y="478" class="small" text-anchor="start">图为工程流程示意；访问权限应在材料进入上下文前执行。</text>
</svg>